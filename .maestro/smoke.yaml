appId: ${APP_ID}
name: Smoke - app starts on Invoices, Settings opens, theme persists
tags:
  - smoke
---
- runFlow:
    file: subflows/reset.yaml
    env:
      UI_LANG: en
- assertVisible:
    id: documents-empty
- tapOn:
    id: tab-settings
- assertVisible:
    id: settings-screen
- tapOn:
    id: settings-language
- tapOn:
    id: theme-dark
- assertVisible:
    id: theme-dark
    selected: true
- stopApp
- runFlow: subflows/launch.yaml
- tapOn:
    id: tab-settings
- tapOn:
    id: settings-language
- assertVisible:
    id: theme-dark
    selected: true
- tapOn:
    id: theme-system
