# Flows share one simulator and one database and every flow starts with subflows/reset.yaml, so they run one after
# another in this order (by flow name). Subflows live in subflows/ (not run on their own).
flows:
  - "*"
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - "Smoke - app starts on Invoices, Settings opens, theme persists"
    - "Zero prompt - first launch shows no dialog and New invoice works at once"
    - "First invoice - client, line, check lists missing business details, Fix, Issue gives RE-2026-0001"
    - "Repeat invoice - recent client + 2 catalog items, issued and in the share sheet in 9 taps (A6)"
    - "Examples A and B on screen - 1.330,29 and 75,97 (A1), German formats"
    - "Quote to invoice - issue quote, accept, convert, issue invoice"
    - "Autosave - kill the app while editing, the draft is intact after reopening (A7)"
    - "Autosave forms - a line, a client and an item survive a back-swipe and an app kill without Save (review 7)"
    - "Numbering settings - next number 43, invalid pattern refused, lowering below a used number refused"
    - "Clients and items - EU client gets a reverse-charge suggestion, an item is created and found in the picker"
    - "Language - the UI switches to German and back, the choice survives a restart"
    - "Date field - typed date is saved, the system date picker opens"
    - "Dates at Issue - an invalid typed date stops Issue with a message; a stale draft asks for the date of supply (review 5 and 8)"
    - "Issue while typing - text typed just before Issue on a draft that cannot be issued survives (write queue, D50)"
    - "§19 - a draft with VAT lines is blocked at Issue, one tap sets the lines to 0 %"
    - "P3.5 probes - write queue, triggers, migrations 3-4 and JSON1 on real expo-sqlite"
    - "PDF probe - expo-print files on this device (pages, size, fonts, stability), real layout room, tall-row refusal"
    - "PDF share - issued invoice shows page 1, Share opens the system sheet with RE-2026-0001 Müller GmbH.pdf, Mark as sent"
    - "E-mail - mail app opens with the PDF; without a mail account (iOS Simulator) the text is copied and the share sheet opens"
    - "Print - the system print dialog opens with the PDF and can be dismissed"
    - "Preview check - a draft without business details shows the missing items in the preview, Fix opens the form, layout chips change the draft"
    - "Payments - part payment, the rest, an overpayment; statuses, balance and Home summary match (A8); payment receipt"
    - "Cancel invoice - Storno gets the next number with negative amounts, the original is cancelled, a corrected copy is a draft (A3)"
    - "Client detail - outstanding amount and the client's documents"
    - "Reminders - asked once in context, an overdue invoice schedules one notification, it appears at the reminder time and opens the invoice (A10)"
    - "Backup and restore - back up, delete all, restore: identical data hash (A11), summary before the restore"
    - "Delete all data - two steps, then nothing is left; numbering continues; reset numbering is a separate warned action"
    - "CSV export - period chooser, the documents file opens the share sheet"
    - "About and privacy - privacy text, placeholder address, licences, German texts"
    - "Business card - on-device text recognition fills a new client (name, contact, address, e-mail, phone, VAT id); delivery address saved"
    - "Attachments - a receipt photo printed as a page after the invoice (the issued PDF has 2 pages), another goes with the e-mail, printed pages stay locked"
    - "Signatures - the business draws its signature; a client accepts an issued quote with a finger signature; the signed copy is shared"
    - "CSV import - preview counts (2 ready, 1 duplicate, 1 skipped with its line), import, the clients are in the list"
    - "Item photo - a catalog item gets a photo (stored downscaled), it is still there after reopening"
