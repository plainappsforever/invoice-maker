appId: ${APP_ID}
name: Dates at Issue - an invalid typed date stops Issue with a message; a stale draft asks for the date of supply (review 5 and 8)
tags:
  - core
---
- runFlow:
    file: subflows/reset.yaml
    env:
      UI_LANG: en
- runFlow:
    file: subflows/seed.yaml
    env:
      FIXTURE: business
- tapOn:
    id: new-document
- scrollUntilVisible:
    element:
      id: add-line
    centerElement: true
- tapOn:
    id: add-line
- tapOn:
    id: line-name
- inputText: Work
- runFlow: subflows/hide-keyboard.yaml
- tapOn:
    id: line-price
- inputText: "100"
- runFlow: subflows/hide-keyboard.yaml
- scrollUntilVisible:
    element:
      id: line-save
    centerElement: true
- tapOn:
    id: line-save
# 1. A US-style date is not a date the app reads: it is not saved, and Issue refuses instead of using the old date.
- scrollUntilVisible:
    element:
      id: issue-date
    direction: UP
    centerElement: true
- tapOn:
    id: issue-date
- eraseText: 12
- inputText: 10/1/2026
- runFlow: subflows/hide-keyboard.yaml
- tapOn:
    id: issue-button
- assertVisible: Fix the highlighted field
- tapOn: OK
# 2. A draft dated in the past with "date of supply = issue date": Issue is blocked until the date is chosen.
- tapOn:
    id: issue-date
- eraseText: 12
- inputText: 2026-01-15
- runFlow: subflows/hide-keyboard.yaml
- runFlow:
    file: subflows/wait.yaml
    env:
      MS: "1000"
- tapOn:
    id: issue-button
- extendedWaitUntil:
    visible:
      id: check-item-service_date_stale
    timeout: 20000
- assertVisible:
    id: check-blocked
- tapOn:
    id: check-fix-service-keep
- extendedWaitUntil:
    visible:
      id: check-item-issue_date_past
    timeout: 20000
- assertNotVisible:
    id: check-item-service_date_stale
- tapOn:
    id: issue-anyway
- extendedWaitUntil:
    visible: .*RE-2026-0001.*
    timeout: 30000
